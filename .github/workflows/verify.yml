name: Verify samples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    name: Verify configuration files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check JSON syntax
        run: >-
          jq empty
          templates/claude-code/devcontainer.json
          templates/claude-code/settings.json
          templates/codex/devcontainer.json
          templates/copilot-cli/devcontainer.json

  project:
    name: Verify ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - starter
          - solutions/claude-code/vibe
          - solutions/claude-code/spec-driven
          - solutions/claude-code/autonomous
          - solutions/codex/vibe
          - solutions/codex/spec-driven
          - solutions/codex/autonomous
          - solutions/copilot-cli/vibe
          - solutions/copilot-cli/spec-driven
          - solutions/copilot-cli/autonomous
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
