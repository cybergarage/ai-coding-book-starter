name: Verify samples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: starter/.nvmrc
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
